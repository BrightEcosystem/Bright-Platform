name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Valores de exemplo, não secretos: NEXT_PUBLIC_* são seguros para o
      # navegador por definição. Servem apenas para satisfazer a validação de
      # formato em src/config/env.ts durante o build (nenhuma página desta
      # fase busca dados do Supabase em tempo de build). Se uma página futura
      # passar a exigir dados reais durante o build (SSG/ISR), substituir por
      # secrets do repositório apontando para um projeto Supabase real.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.9.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
